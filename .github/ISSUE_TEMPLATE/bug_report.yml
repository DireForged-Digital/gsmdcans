name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - Android
        - Web
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and device
      placeholder: e.g. 1.2.0 (45), iPhone 15, iOS 26.1
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or anything else
